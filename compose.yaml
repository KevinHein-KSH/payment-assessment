services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: payment_assessment
      MYSQL_USER: ${MYSQL_USER:-payment}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-payment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP (not the socket) so it stays unhealthy while the init-time temporary server runs
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/PaymentAssessment.Api/Dockerfile
    ports:
      - "5080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: Server=mysql;Port=3306;Database=payment_assessment;User=${MYSQL_USER:-payment};Password=${MYSQL_PASSWORD:-payment}
      ConnectionStrings__Redis: redis:6379
    volumes:
      - ./backend/src/PaymentAssessment.Api/appsettings.Development.json:/app/appsettings.Development.json:ro

volumes:
  mysql-data:
